services:
  db:
    container_name: car-journal-db-dev
    image: postgres:16

    env_file: .env

    ports:
      - "5432:5432"

    volumes:
      - postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres: